# Full self-hosted stack. `docker compose up -d` and you're done.
# Requires a `.env` file (copy from .env.example, fill secrets).
#
# Services:
#   db         Postgres 15
#   redis      Redis 7
#   migrate    Runs `prisma migrate deploy` once, exits — gates the app services
#   web        Next.js server on :3000
#   crawler    BrickLink price crawler loop
#   scheduler  Auto-sync + BSX-import + cleanup loop
#
# BSX orders are configured entirely in the UI (Settings → BSX-Import).
# For a LOCAL folder you must bind-mount it into the container — set
# BSX_HOST_PATH in .env. For a NETWORK SHARE (SMB/NAS) no host-side setup
# is needed — enter host/share/user/password directly in the UI.

x-app-common: &app-common
  # Standard: fertiges Image aus GHCR (~500 MB Pull, 30 Sek).
  # Für lokale Entwicklung: `docker compose up -d --build` überschreibt mit
  # lokalem Build. Für gepinnte Version: IMAGE=ghcr.io/…:v1.2.3 in .env.
  image: ${IMAGE:-ghcr.io/rainman19121979/bl-price-tracker:latest}
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    DATABASE_URL: postgresql://pricetracker:${DB_PASSWORD:?DB_PASSWORD not set}@db:5432/pricetracker
    REDIS_URL: redis://redis:6379
    NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET not set}
    NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY not set}
    NODE_ENV: production
  restart: unless-stopped
  volumes:
    # Optional local BSX folder — only used when Settings → BSX-Import
    # is set to "Lokaler Ordner". For SMB shares this mount is unused.
    - ${BSX_HOST_PATH:-./bsx-orders}:/bsx-orders:ro
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pricetracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD not set}
      POSTGRES_DB: pricetracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricetracker -d pricetracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app-common
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]

  web:
    <<: *app-common
    ports:
      # WEB_PORT can be "3000" (public) or "127.0.0.1:3000" (Tailscale/SSH-tunnel only)
      - "${WEB_PORT:-3000}:3000"
      # Also expose internally for Caddy in the overlay
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  crawler:
    <<: *app-common
    command: ["npx", "tsx", "--tsconfig", "tsconfig.worker.json", "src/workers/crawler.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scheduler:
    <<: *app-common
    command: ["npx", "tsx", "--tsconfig", "tsconfig.worker.json", "src/workers/scheduler.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
